<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 뭐 입지</title>
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘 뭐 입지">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<style>
:root {
  --bg: #f6f3ee; --card: #fff; --ink: #24211d; --sub: #7d766c; --line: #e8e2d8; --soft: #f1ece4;
  --accent: #3d6fe0; --accent-soft: #e6edfc; --accent-ink: #fff;
  --cold: #3d7be0; --good: #2e9b5e; --hot: #e2553b; --warn: #d98a1c;
  --thumb: #f3efe8; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514; --card: #22201e; --ink: #f1ede6; --sub: #a59e93; --line: #36322e; --soft: #2b2926;
    --accent: #7ea2ff; --accent-soft: #283553; --accent-ink: #10172b;
    --cold: #7ea8ff; --good: #5fcb8c; --hot: #ff8a70; --warn: #f2b45a;
    --thumb: #ece7df; --shadow: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; word-break: keep-all; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 540px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 92px); }
.view[hidden] { display: none; }
h1 { font-size: 22px; margin: 4px 0 12px; letter-spacing: -.3px; }
h2 { font-size: 17px; margin: 0; letter-spacing: -.2px; }
.card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.muted { color: var(--sub); font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap-row { flex-wrap: wrap; }
.spacer { flex: 1; }
.btn { border: 0; border-radius: 12px; padding: 10px 14px; background: var(--soft); font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--sub); padding: 6px 8px; }
.btn.danger { background: transparent; color: var(--hot); }
.btn.block { width: 100%; padding: 13px; }
.btn:disabled { opacity: .5; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll .chip { flex: none; }
input[type=text], input[type=search], input[type=date], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
label.f { display: block; font-size: 13px; color: var(--sub); margin: 14px 0 6px; font-weight: 600; }

/* 상단 */
.top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.place { border: 0; background: none; padding: 4px 0; font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 4px; min-width: 0; }
.place span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.daytabs { display: flex; background: var(--soft); border-radius: 12px; padding: 3px; margin-left: auto; flex: none; }
.daytabs button { border: 0; background: none; padding: 6px 12px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--sub); }
.daytabs button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

/* 날씨 */
.wx-main { display: flex; align-items: center; gap: 14px; }
.wx-icon { font-size: 46px; line-height: 1; }
.wx-feel { font-size: 34px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
.wx-feel small { font-size: 15px; font-weight: 600; color: var(--sub); letter-spacing: 0; margin-left: 4px; }
.hours { display: flex; gap: 4px; overflow-x: auto; margin: 14px -4px 0; padding: 0 4px; scrollbar-width: none; }
.hours::-webkit-scrollbar { display: none; }
.hour { flex: 1 0 44px; text-align: center; font-size: 12px; color: var(--sub); background: var(--soft); border-radius: 10px; padding: 6px 2px; }
.hour b { display: block; color: var(--ink); font-size: 14px; }
.hour i { font-style: normal; display: block; font-size: 15px; }
.notes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.note { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--soft); }
.note.rain { background: #e3eefc; color: #1f4f9c; }
.note.wind, .note.gap { background: #fdf0dc; color: #8a5300; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .note.rain { background: #22324d; color: #b9d0ff; } :root:not([data-theme="light"]) .note.wind, :root:not([data-theme="light"]) .note.gap { background: #3d311d; color: #f2cf96; } }

/* 코디 */
.outfit-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.fitword { margin-left: auto; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--soft); white-space: nowrap; }
.fitword.good { color: var(--good); } .fitword.cold, .fitword.cool { color: var(--cold); } .fitword.hot, .fitword.warm { color: var(--hot); }
.pieces { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.piece { text-align: center; font-size: 12px; color: var(--sub); min-width: 0; }
.piece .ph { aspect-ratio: 1; }
.piece div.nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
.piece .role { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 0 6px; border-radius: 6px; }
.layer-note { font-size: 13px; margin: 8px 0 0; color: var(--sub); }
.ph { background: var(--thumb); border-radius: 14px; display: grid; place-items: center; overflow: hidden; font-size: 34px; }
.ph img { width: 88%; height: 88%; object-fit: contain; }
.generic { background: var(--soft); border-radius: 14px; padding: 12px 14px; font-weight: 600; }
.why { font-size: 13px; color: var(--sub); margin: 12px 0 0; }
.actions { display: flex; gap: 6px; margin-top: 14px; }
.actions .btn { flex: 1; padding: 10px 6px; font-size: 14px; white-space: nowrap; }

/* 느낌 */
.feels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 12px; }
.feel-btn { border: 2px solid transparent; background: var(--soft); border-radius: 14px; padding: 8px 2px; font-size: 12px; font-weight: 600; line-height: 1.25; min-width: 0; }
.feel-btn span { display: block; font-size: 26px; margin-bottom: 2px; }
.feel-btn.on { border-color: var(--accent); background: var(--accent-soft); }

/* 옷장 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; margin-top: 12px; }
.item { border: 0; background: var(--card); border-radius: 16px; padding: 8px; text-align: left; box-shadow: var(--shadow); position: relative; min-width: 0; }
.item .ph { aspect-ratio: 1; }
.item .nm { font-size: 13px; font-weight: 600; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .wm { font-size: 11px; color: var(--sub); letter-spacing: 1px; }
.item.away { opacity: .5; }
.badge { position: absolute; top: 12px; left: 12px; font-size: 11px; background: rgba(0,0,0,.6); color: #fff; padding: 1px 7px; border-radius: 999px; }
.empty { text-align: center; color: var(--sub); padding: 36px 12px; }
.empty b { display: block; font-size: 40px; margin-bottom: 6px; }
.fab { position: fixed; right: max(16px, calc(50% - 254px)); bottom: calc(env(safe-area-inset-bottom) + 80px); border: 0; border-radius: 999px; padding: 14px 20px; background: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.18); z-index: 5; }

/* 기록 */
.chart { width: 100%; height: auto; display: block; margin-top: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--sub); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.legend i.line { width: 16px; height: 3px; border-radius: 2px; vertical-align: 3px; }
.log { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.log:first-of-type { border-top: 0; }
.log .em { font-size: 26px; }
.log .dt { font-weight: 700; font-size: 15px; }
.log .mini { display: flex; gap: 3px; margin-left: auto; }
.log .mini .ph { width: 30px; height: 30px; border-radius: 8px; font-size: 16px; }

/* 아래 탭 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
.tabbar button { flex: 1; max-width: 135px; border: 0; background: none; padding: 8px 0 7px; font-size: 11px; color: var(--sub); font-weight: 600; }
.tabbar button span { display: block; font-size: 22px; line-height: 1.2; filter: grayscale(1); opacity: .6; }
.tabbar button.on { color: var(--ink); }
.tabbar button.on span { filter: none; opacity: 1; }

/* 아래에서 올라오는 창 */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg[hidden] { display: none; }
.sheet { background: var(--bg); width: 100%; max-width: 540px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 8px 16px calc(env(safe-area-inset-bottom) + 20px); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
.sheet-head { display: flex; align-items: center; margin-bottom: 8px; }
.sheet-head h2 { flex: 1; }
.preview { width: 180px; height: 180px; margin: 0 auto; border-radius: 18px; background-color: #fff; background-image: linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%), linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; display: grid; place-items: center; overflow: hidden; font-size: 64px; }
.preview img { max-width: 92%; max-height: 92%; }
.ai-sugg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.ai-sugg .chip small { color: inherit; opacity: .7; margin-left: 3px; }
.ai-tag { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 6px; margin-left: 6px; }
.color-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.15); }
.progress { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; margin: 14px 0 8px; }
.progress div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.step { padding: 6px 0; color: var(--sub); }
.step.on { color: var(--ink); font-weight: 600; }
.step.done { color: var(--good); }
.clear-wrap { position: relative; }
.clear-wrap input { padding-right: 40px; }
.clear-x { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--sub); color: var(--card); font-size: 14px; line-height: 28px; padding: 0; cursor: pointer; }
.clear-x[hidden] { display: none; }
.check { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 15px; }
.check input { width: 20px; height: 20px; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; margin-top: 8px; }
.pick { border: 2px solid transparent; background: var(--card); border-radius: 14px; padding: 4px; font-size: 11px; color: var(--sub); min-width: 0; }
.pick .ph { aspect-ratio: 1; font-size: 26px; }
.pick div.nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick.on { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.results button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 12px 4px; }
.code { font: 600 18px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1px; background: var(--soft); padding: 10px 12px; border-radius: 12px; word-break: break-all; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px); transform: translateX(-50%); background: rgba(30,30,30,.92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 40; max-width: 90vw; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }
.skel { color: var(--sub); text-align: center; padding: 24px 0; }

/* 아침·낮·저녁 */
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.slot { background: var(--soft); border-radius: 12px; padding: 8px 4px; text-align: center; font-size: 12px; color: var(--sub); min-width: 0; }
.slot b { display: block; color: var(--ink); font-size: 14px; }
.slot .sw { display: block; font-weight: 700; font-size: 13px; margin-top: 2px; }
.slot .sw.good { color: var(--good); } .slot .sw.cold, .slot .sw.cool { color: var(--cold); } .slot .sw.hot, .slot .sw.warm { color: var(--hot); }
.slot .off { display: block; font-size: 11px; color: var(--good); font-weight: 600; }
.slot-tip { font-size: 13px; font-weight: 600; margin: 8px 0 0; }
.rate-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 10px 0; border-top: 1px solid var(--line); }
.rate-row:first-child { border-top: 0; }
.rate-row .rl { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.rate-row .rl b { font-size: 15px; }
.rate-row .rl span { font-size: 12px; }
.rate-btn { border: 2px solid transparent; background: var(--soft); border-radius: 12px; padding: 5px 0 4px; font-size: 22px; line-height: 1.2; min-width: 0; }
.rate-btn small { display: block; font-size: 10.5px; color: var(--sub); font-weight: 600; white-space: nowrap; }
.rate-btn.on { border-color: var(--accent); background: var(--accent-soft); }
.rate-btn.on small { color: var(--ink); }

/* 사진 맞추기 */
.adj-frame { margin: 4px auto 0; border-radius: 16px; overflow: hidden; touch-action: none; background-color: #fff; background-image: linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%), linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; outline: 2px solid var(--accent); outline-offset: -2px; cursor: grab; }
.adj-frame canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.adj-tools { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-top: 10px; }
.adj-tools .btn { padding: 10px 4px; font-size: 14px; }
.adj-frame.brush { cursor: crosshair; }
.brush-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.brush-row input[type=range] { flex: 1; }
.adj-frame.dark { background-color: #000; background-image: none; }
.hist-row { display: flex; gap: 6px; margin-top: 10px; }
.hist-row .btn { flex: 1; padding: 10px 4px; font-size: 14px; }
.hist-row .btn.on { background: #000; color: #fff; }
.nope-btn { display: block; margin: 10px auto 0; font-size: 14px; }
.nope-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.nope-row:first-of-type { border-top: 0; }
.nope-pics { display: grid; grid-template-columns: repeat(2, 36px); gap: 4px; flex-shrink: 0; }
.nope-pics .ph { width: 36px; height: 36px; border-radius: 8px; background: var(--soft); display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 20px; }
.nope-pics .ph img { width: 100%; height: 100%; object-fit: contain; }
.nope-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 14px; }
.nope-txt b { font-weight: 600; overflow-wrap: anywhere; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.edit-photo { display: block; margin: 8px auto 0; }
.photo-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.photo-btns .edit-photo { margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <!-- 홈 -->
  <section class="view" id="homeView">
    <div class="top">
      <button class="place" id="btnPlace">📍 <span id="placeName">위치 찾는 중…</span></button>
      <div class="daytabs" id="dayTabs"><button data-day="0" class="on">오늘</button><button data-day="1">내일</button></div>
    </div>
    <div class="card" id="wxCard"><div class="skel">날씨 불러오는 중…</div></div>
    <div class="card" id="outfitCard"></div>
    <div class="card" id="feelCard" hidden></div>
  </section>

  <!-- 옷장 -->
  <section class="view" id="closetView" hidden>
    <h1>내 옷장 <span class="muted" id="closetCount"></span></h1>
    <div class="chips scroll" id="seasonChips"></div>
    <div class="chips scroll" id="catChips"></div>
    <div class="grid" id="closetGrid"></div>
    <button class="fab" id="btnAdd">＋ 옷 추가</button>
  </section>

  <!-- 기록 -->
  <section class="view" id="logView" hidden>
    <h1>기록과 분석</h1>
    <div class="card" id="analysisCard"></div>
    <div class="card" id="logList"></div>
  </section>

  <!-- 설정 -->
  <section class="view" id="setView" hidden>
    <h1>설정</h1>
    <div class="card">
      <h2>위치</h2>
      <p class="muted" id="setPlaceNow"></p>
      <div class="row"><button class="btn" id="setGps">📍 현재 위치 쓰기</button><button class="btn" id="setCity">🔎 지역 고르기</button></div>
    </div>
    <div class="card">
      <h2>외출 시간</h2>
      <p class="muted">이 시간대 날씨로 옷을 골라요. 아침·저녁 쌀쌀함도 챙겨요.</p>
      <div class="row"><select id="setStart"></select><span>~</span><select id="setEnd"></select></div>
    </div>
    <div class="card" id="setNope"></div>
    <div class="card" id="setStore"></div>
    <div class="card">
      <h2>폰 안의 AI</h2>
      <p class="muted">옷 사진의 배경을 지우고 종류·두께를 짐작하는 무료 AI예요. 처음 한 번만 파일(약 90MB)을 받아서 폰에 저장해요. 와이파이에서 미리 받아 두면 좋아요.</p>
      <p class="muted" id="aiState"></p>
      <div class="row"><button class="btn" id="aiPre">AI 미리 받기</button><button class="btn ghost" id="aiDel">AI 파일 지우기</button></div>
    </div>
    <p class="muted" style="text-align:center">오늘 뭐 입지 · <span id="appVer"></span><br>날씨: Open-Meteo</p>
  </section>
</div>

<nav class="tabbar" id="tabbar">
  <button data-go="home" class="on"><span>🌤️</span>오늘</button>
  <button data-go="closet"><span>👕</span>옷장</button>
  <button data-go="log"><span>📊</span>기록</button>
  <button data-go="set"><span>⚙️</span>설정</button>
</nav>

<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet"></div></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
// 안전장치: 앱 코드가 못 켜지면(폰에 예전 파일이 섞였을 때 등) 멈춘 화면 대신 알림 + '새로 받기' 버튼을 보여 줘요.
(function () {
  let msg = "";
  window.addEventListener("error", (e) => { if (!window.__appReady) msg = msg || String(e.message || e.error || ""); });
  function rescue() {
    if (window.__appReady || document.getElementById("rescue")) return;
    const d = document.createElement("div");
    d.id = "rescue";
    d.style.cssText = "position:fixed;inset:0;z-index:9999;background:#f4f1ec;color:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font:16px/1.6 -apple-system,sans-serif";
    d.innerHTML = '<div style="font-size:40px">😵</div><b>앱을 켜지 못했어요</b><p style="margin:8px 0 16px;color:#666">폰에 저장된 예전 파일이 섞였을 수 있어요.<br>아래 버튼을 누르면 새로 받아요. (옷장·기록은 그대로예요)</p>'
      + '<button id="rescueBtn" style="font:inherit;font-weight:700;padding:12px 24px;border:0;border-radius:12px;background:#3d6fe0;color:#fff">🔄 새로 받기</button>'
      + (msg ? '<p style="margin-top:16px;font-size:12px;color:#999;word-break:break-all">' + msg.replace(/</g, "&lt;") + '</p>' : "");
    document.body.appendChild(d);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const r1 = (x) => Math.round(x);
const CAT_EMOJI = { top: "👕", outer: "🧥", bottom: "👖", dress: "👗", shoes: "👟", acc: "🧣" };

// ---------- 설정 ----------
const DEFAULT_PLACE = { mode: "gps", name: "부산 금정구", lat: 35.2462, lon: 129.0883 };

// ---------- 저장소 (Firebase 또는 이 폰) ----------

    subscribe(f) { cb = f; f(all()); },
    set: async (id, data) => save([{ ...data, id }, ...all().filter((x) => x.id !== id)]),

  };
}
let fb = null;
async function firebaseStore(code, name) {
  const V = "10.12.2";
  if (!fb) {
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);

}
let itemStore, logStore;
let items = [], logs = [], byId = {};
const online = () => !!(CFG.FIREBASE && ls.get("wx.code"));

// ---------- 날씨 ----------
const WCODE = (c) =>
  c === 0 ? ["☀️", "맑음"] : c <= 2 ? ["🌤️", "구름 조금"] : c === 3 ? ["☁️", "흐림"] : c <= 48 ? ["🌫️", "안개"] :
  c <= 57 ? ["🌦️", "이슬비"] : c <= 67 ? ["🌧️", "비"] : c <= 77 ? ["🌨️", "눈"] : c <= 82 ? ["🌦️", "소나기"] : c <= 86 ? ["🌨️", "눈"] : ["⛈️", "뇌우"];
let wx = null, day = 0;

async function locate() {
  if (S.place.mode !== "gps") return S.place;
  const last = ls.get("wx.lastPos", null);
  try {
    const pos = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { timeout: 8000, maximumAge: 30 * 60e3 }));
    const p = { lat: +pos.coords.latitude.toFixed(3), lon: +pos.coords.longitude.toFixed(3) };
    if (!last || Math.abs(last.lat - p.lat) > 0.02 || Math.abs(last.lon - p.lon) > 0.02 || !last.name) p.name = await placeName(p);
    else p.name = last.name;

  } catch {
    if (last) return last;

async function placeName({ lat, lon }) {
  try {
    const r = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`)).json();
    const parts = [r.city, r.locality].filter(Boolean);

async function loadWeather(force = false) {

  if (!force && cache && Date.now() - cache.at < 30 * 60e3 && Math.abs(cache.lat - p.lat) < 0.02 && Math.abs(cache.lon - p.lon) < 0.02) { wx = cache.data; return; }
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}` +
    `&current=temperature_2m,apparent_temperature,weather_code` +
    `&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m` +

// 그날 외출 시간대 정보
function dayInfo(d) { return wx ? hoursInfo(wx, dateOf(d)) : null; }
// 날씨 자료(Open-Meteo) + 날짜 → 그날 외출 시간대 정보 (지난 날 기록에도 써요)
function hoursInfo(data, date) {
  const h = data.hourly, hours = [];
  h.time.forEach((t, i) => {
    if (!t.startsWith(date)) return;
    const hr = +t.slice(11, 13);

    hours.push({ hr, temp: h.temperature_2m[i], feel: h.apparent_temperature[i], pop: h.precipitation_probability?.[i] ?? 0, rain: h.precipitation?.[i] ?? 0, code: h.weather_code?.[i] ?? 0, wind: h.wind_speed_10m?.[i] ?? 0 });
  });

    tmin: Math.min(...hours.map((x) => x.temp)), tmax: Math.max(...hours.map((x) => x.temp)) };
}

// ---------- 추천 ----------
let model = { c: 0, d: 0, n: 0 }, recs = [], recIdx = 0, recKey = "", keepIdx = null;
// '마음에 안 들어요' 기록: 코디의 첫 옷(상의·원피스)에 { ids: 겉에 보이는 옷 id들, at, date }로 붙여 둬요
//  (Firebase 규칙을 안 바꿔도 되고, 그 옷을 지우면 기록도 같이 없어져요)
const nopeList = () => items.flatMap((it) => (it.nope || []).map((n, i) => ({ ...n, owner: it, i }))).sort((a, b) => b.at - a.at);
const logOf = (date) => logs.find((g) => g.id === date);
function recentSet(date) {
  const s = new Set(), t = new Date(date + "T00:00");
  for (const g of logs) { const age = (t - new Date(g.id + "T00:00")) / 864e5; if (age >= 1 && age <= 2) (g.items || []).forEach((id) => s.add(id)); }
  return s;
}

// 최근 4일 안(= 5일 텀을 안 둔) 입은 코디들 — 같은 코디는 되도록 다시 추천하지 않아요
function recentFits(date) {
  const t = new Date(date + "T00:00"), out = [];
  for (const g of logs) { const age = (t - new Date(g.id + "T00:00")) / 864e5; if (age >= 1 && age <= 4 && g.items?.length) out.push(new Set(g.items)); }
  return out;
}

function renderHome() {
  const info = dayInfo(day);
  if (!info) { $("#wxCard").innerHTML = `<div class="skel">날씨를 불러오지 못했어요 <button class="btn" id="retryWx">다시</button></div>`; $("#retryWx")?.addEventListener("click", () => start(true)); $("#outfitCard").innerHTML = ""; $("#feelCard").hidden = true; return; }

  if (info.tmax - info.tmin >= 8) notes.push(`<span class="note gap">🌡️ 일교차 ${r1(info.tmax - info.tmin)}° — 벗기 쉬운 겉옷</span>`);
  const cur = day === 0 && wx.current ? ` · 지금 ${r1(wx.current.temperature_2m)}°` : "";
  const hrs = info.hours.filter((x, i) => i % 2 === 0 || info.hours.length <= 8);

    ${notes.length ? `<div class="notes">${notes.join("")}</div>` : ""}`;

  if (key !== recKey) { recKey = key; recIdx = keepIdx ?? 0; keepIdx = null; recs = recommend({ items, t: info.T, want, date: info.date, recent: recentSet(info.date), recentFits: recentFits(info.date), nope: nopeList().map((n) => n.ids), slots }); }
  const rec = picked ? { items: picked, W: outfitWarmth(picked) } : recs[recIdx % Math.max(1, recs.length)];

  $("#outfitCard").innerHTML = `${body}<p class="why">${why}${gapWhy}</p><div class="actions">${btns}</div>${nopeBtn}`;
  renderFeel(info, rec, want);
}

// 코디 사진들 + 이너·겉옷 대신 표시 + 이너 챙기기 알림
function piecesHtml(list) {
  const L = layers(list);
  const role = (it) => it === L.inner ? "이너" : it === L.outer && L.shirtOuter ? "겉옷 대신" : "";
  const notes = [];
  if (L.noInner) notes.push(L.noInner.innerPick?.length && typeOf(L.noInner.type).cat === "top"
    ? `💡 '${esc(L.noInner.name)}' 안에 이너를 같이 입으면 좋아요. (골라 둔 이너가 ${L.noInner.innerPick.every((x) => x === "heat") ? `히트텍뿐이라 ${HEAT_MAX}°보다 따뜻한 날엔 안 골랐어요` : "이 코디엔 안 맞았어요"})`
    : `💡 '${esc(L.noInner.name)}'${eun(L.noInner.name)} 비쳐서 안에 이너(나시 등)를 같이 입으면 좋아요. 옷장에 나시를 넣으면 같이 골라 줘요.`);
  for (const b of L.bottomInner) notes.push(`💡 '${esc(b.name)}' 안에 속바지·속치마를 챙기세요.`);
  const pc = patternClash(list, [L.inner]);
  const pk = (id) => PATTERNS.find((p) => p.id === id)?.ko;
  const pn = pointCount(list, [L.inner]);
  if (pn >= 2) notes.push(`💡 포인트 옷이 ${pn}벌이에요. 하나만 두면 더 깔끔해요.`);
  if (pc) notes.push(`💡 ${pc[0] === pc[1] ? `${pk(pc[0])} 옷이 두 벌` : `${pk(pc[0])}와 ${pk(pc[1])}가 같이`} 있어요. 한쪽을 무지로 바꾸면 더 깔끔해요.`);
  return `<div class="pieces">${list.map((it) => `<div class="piece"><div class="ph">${phHtml(it)}</div><div class="nm">${esc(it.name)}</div>${role(it) ? `<span class="role">${role(it)}</span>` : ""}</div>`).join("")}</div>
    ${notes.map((n) => `<p class="layer-note">${n}</p>`).join("")}`;
}

// 아침·낮·저녁마다 이 코디가 맞는지 (시간대가 두 개 이상일 때만)
function slotHtml(list, info) {
  const sl = slotFeels(info.hours);
  if (sl.length < 2) return "";
  const ev = evalSlots(list, sl, model);
  return `<div class="slots">${ev.rows.map((r) => `<div class="slot">${r.emoji} ${r.ko}<br>${r.start}~${r.end}시<b>${r1(r.T)}°</b>
      <span class="sw ${r.off ? (r.offGood ? "good" : r.cls) : r.cls}">${r.off ? "겉옷 벗기" : r.word}</span>${r.off ? `<span class="off">${r.offGood ? "벗으면 딱" : "벗으면 나아요"}</span>` : ""}</div>`).join("")}</div>
    <p class="slot-tip">${esc(ev.tip)}</p>`;
}

const rateBtns = (slot, cur) => Object.entries(FEEL).map(([k, f]) => `<button class="rate-btn${cur === k ? " on" : ""}" data-slot="${slot}" data-feel="${k}" aria-label="${f.ko}">${f.emoji}<small>${f.short}</small></button>`).join("");
// 시간대별 느낌 줄 (홈·기록 화면 같이 씀)
function rateRows(sl, slots) {
  return sl.map((s) => `<div class="rate-row"><div class="rl"><b>${s.emoji} ${s.ko}</b><span class="muted">${s.start != null ? `${s.start}~${s.end}시 · ` : ""}체감 ${r1(s.T)}°</span></div>${rateBtns(s.id, slots[s.id])}</div>`).join("");
}
// 한 시간대 느낌을 누르면(같은 걸 다시 누르면 취소) 바뀐 기록
function withSlot(g, slot, feel, sl) {
  const slots = { ...(g.slots || {}) };
  if (slots[slot] === feel) delete slots[slot]; else slots[slot] = feel;
  const slotT = { ...(g.slotT || {}), ...Object.fromEntries(sl.map((s) => [s.id, +s.T.toFixed(1)])) };
  return { ...g, slots, slotT, feel: overallFeel(slots), at: Date.now() };
}

function renderFeel(info, rec, want) {
  const card = $("#feelCard");
  // 오늘: 오늘 어땠는지 / 내일 화면: 숨김. 어제 기록이 남아 있으면 같이 물어봐요.
  if (day !== 0) { card.hidden = true; return; }
  const y = dateOf(-1), yl = logOf(y);
  const today = logOf(info.date);
  const now = new Date().getHours();
  const sl = slotFeels(info.hours);
  let html = `<h2>오늘 입은 옷 어땠어요?</h2><p class="muted" style="margin:4px 0 6px">${now < 15 && !today?.feel ? "아침·낮·저녁마다 따로 눌러 주면 다음 추천이 더 정확해져요." : "누를 때마다 나에게 맞게 배워요. 다시 누르면 취소돼요."}</p>
    <div>${rateRows(sl, today?.slots || {})}</div>`;
  if (yl?.items?.length && !yl.feel) html += `<p class="muted" style="margin:14px 0 0">어제(${md(y)}) 입은 옷은 어땠어요?</p>
    <div class="feels">${Object.entries(FEEL).map(([k, f]) => `<button class="feel-btn" data-yfeel="${k}"><span>${f.emoji}</span>${f.ko}</button>`).join("")}</div>`;
  card.innerHTML = html;
  card.hidden = false;
  card.onclick = async (e) => {
    const b = e.target.closest("[data-slot],[data-yfeel]");
    if (!b) return;
    if (b.dataset.yfeel) { await logStore.set(y, { ...yl, feel: b.dataset.yfeel, at: Date.now() }); toast("어제 기록을 저장했어요"); return; }
    const list = rec?.items || [], s = SLOTS.find((x) => x.id === b.dataset.slot);
    const undo = today?.slots?.[s.id] === b.dataset.feel;
    await logStore.set(info.date, withSlot({
      ...(today || {}), date: info.date, T: +info.T.toFixed(1), tmin: info.tmin, tmax: info.tmax, want: +want.toFixed(2),
      items: list.map((x) => x.id), W: rec ? +rec.W.toFixed(2) : +want.toFixed(2),
    }, s.id, b.dataset.feel, sl));
    if (undo) { toast(`${s.ko} 기록을 지웠어요`); return; }
    toast(b.dataset.feel === "good" ? `${s.ko} 딱 좋았군요! 기록했어요 😊` : `${s.ko} 기록했어요. 다음 추천부터 반영돼요`);
  };
}

// ---------- 구멍 메우기 · 손가락 붓 ----------
// adj.bg: AI가 배경을 지운 그대로, adj.hole: "off" | "small"(작은 구멍만, 기본) | "all"(큰 구멍까지)
// adj.strokes: 손가락 붓 기록 [{ mode: "fix"(되살리기)|"erase"(지우기), r, pts:[[x,y]…] }] — 사진 픽셀 기준
// → adj.cut = 구멍 메운 사진 + 붓 기록 (구멍 메우기를 바꿔도 붓으로 고친 건 남아요)
function holeCut(adj) {
  const base = adj.hole === "off" ? adj.bg : (adj.fills[adj.hole] ||= fillHoles(adj.bg, adj.orig, adj.hole === "all" ? { maxHole: Infinity } : {}));
  const c = mk(base.width, base.height);
  c.getContext("2d").drawImage(base, 0, 0);
  for (const s of adj.strokes) for (let i = 0; i < s.pts.length; i++) brushSeg(c, adj.orig, s, s.pts[Math.max(0, i - 1)], s.pts[i]);
  return (adj.cut = c);
}
// 붓 한 토막 (p0 → p1): 되살리기는 원본 사진을 그 자리에 다시 그리고, 지우기는 투명하게
function brushSeg(c, orig, s, p0, p1) {
  const g = c.getContext("2d"), r = s.r;
  const line = (ctx, ox = 0, oy = 0) => { ctx.lineCap = ctx.lineJoin = "round"; ctx.lineWidth = r * 2; ctx.beginPath(); ctx.moveTo(p0[0] - ox, p0[1] - oy); ctx.lineTo(p1[0] - ox + 0.01, p1[1] - oy); ctx.stroke(); };
  if (s.mode === "erase") { g.save(); g.globalCompositeOperation = "destination-out"; line(g); g.restore(); return; }
  // 붓 자리만 원본으로: 작은 종이에 붓 모양을 그리고 그 안에만 원본을 칠해서 붙여요
  const x0 = Math.floor(Math.min(p0[0], p1[0]) - r - 2), y0 = Math.floor(Math.min(p0[1], p1[1]) - r - 2);
  const t = mk(Math.abs(p1[0] - p0[0]) + r * 2 + 4, Math.abs(p1[1] - p0[1]) + r * 2 + 4), tg = t.getContext("2d");
  line(tg, x0, y0);
  tg.globalCompositeOperation = "source-in";
  tg.drawImage(orig, -x0, -y0, c.width, c.height);
  g.drawImage(t, x0, y0);
}

// ---------- 사진 맞추기 ----------
// adj = { cut: 배경 지운 canvas|null, orig: 원본 canvas, W, H, init: 처음 상태, st: 지금 상태 }
// 한 손가락: 옮기기 / 두 손가락: 벌리면 확대, 좁히면 축소 / 컴퓨터는 마우스 휠
// 네모 안에 보이는 그대로 저장돼요. done(사진 주소), cancel이 있으면 '취소' 버튼이 생겨요.
function openAdjust(adj, done, cancel = null) {
  const st = { ...adj.st };
  const F = Math.min(300, $("#sheet").clientWidth - 32 || 300);
  // 손가락 붓: 취소하면 이 화면에서 칠한 것·구멍 메우기를 되돌려요
  let tool = "move", stroke = null, brushSize = 4;   // 붓 크기 1~10 (네모 크기의 1%씩)

function autoName(it) { return [it.color && it.color !== "여러색" ? it.color : "", lenWord(it), typeOf(it.type).ko].filter(Boolean).join(" "); }
// 종류 + AI 짐작 → 길이. 종류 이름에 길이가 있으면(반팔 티셔츠·반바지 등) 그대로, 아니면 AI가 꽤 확실할 때만 AI 말을 따라요.
//  바지는 AI 기장 짐작이 약해서(청바지를 짧다고 함) 종류로 정하고, 치마만 AI 기장 짐작을 써요.
function aiLen(type, ai) {
  const k = lenKind(type);
  if (!k) return null;
  if (LEN_FIXED[typeOf(type).id] || (k === "leg" && typeOf(type).id !== "skirt")) return defaultLen(type);
  const top = ai?.[k]?.[0];
  return top && top.p >= 0.55 ? top.id : defaultLen(type);
}

      : it.inner ? `<p class="muted" style="margin:6px 0 0">${bottom ? "추천할 때 속바지·속치마를 챙기라고 알려 줘요." : "추천할 때 옷장의 나시·반팔 티셔츠를 안에 같이 골라 줘요."}</p>` : ""}`;
    }
    // 셔츠·블라우스: 겉옷으로도 입을지 (예전에 넣은 셔츠는 켜져 있어요)
    if (typeOf(it.type).id === "shirt") h += `<label class="check"><input type="checkbox" id="eAsOuter" ${it.asOuter !== false ? "checked" : ""}>👔 겉옷으로도 입기 (티셔츠·나시·원피스 위에 걸치기)</label>
      <p class="muted" style="margin:2px 0 0">${it.asOuter !== false ? "추천할 때 겉옷 대신으로도 골라요." : "안에 입는 상의로만 추천해요."}</p>`;
    return h;
  };
  // 소매 길이(상의·겉옷·원피스) / 기장(하의·원피스). 조끼처럼 길이가 정해진 건 안 보여요.
  const lenHtml = () => {
    const k = lenKind(it.type);
    if (!k || LEN_FIXED[typeOf(it.type).id] === "none") return "";
    let h = `<label class="f">${k === "leg" ? "기장" : "소매 길이"}${ai && !LEN_FIXED[typeOf(it.type).id] ? `<span class="ai-tag">AI 짐작</span>` : ""}</label>
      <div class="chips">${(k === "leg" ? LEG : SLEEVE).map((x) => `<button class="chip${lenOf(it) === x.id ? " on" : ""}" data-len="${x.id}">${x.ko}</button>`).join("")}</div>`;
    if (hasHem(it.type)) h += `<label class="f">기장</label>
      <div class="chips">${HEM.map((x) => `<button class="chip${hemOf(it) === x.id ? " on" : ""}" data-hem="${x.id}">${x.ko}</button>`).join("")}</div>`;
    return h;
  };
  async function onClick(e) {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.type) setType(b.dataset.type);
    if (b.dataset.warm) { it.warm = +b.dataset.warm; redraw(); }
    if (b.dataset.color) { it.color = it.color === b.dataset.color ? "" : b.dataset.color; rename(); redraw(); }
    if (b.dataset.pat) { it.pattern = b.dataset.pat; redraw(); }
    if (b.dataset.sheer) {
      it.sheer = b.dataset.sheer;
      // 많이 비치면 이너 필요로 (직접 고른 적 없을 때만)
      if (!innerTouched && hasInner(it.type)) it.inner = it.sheer === "much" ? true : it.sheer === "none" ? false : it.inner;
      redraw();
    }
    if (b.dataset.inner) { it.inner = b.dataset.inner === "1"; innerTouched = true; redraw(); }
    if (b.dataset.ipick) { const k = b.dataset.ipick, cur = it.innerPick || []; it.innerPick = INNER_PICKS.map((x) => x.id).filter((x) => (x === k ? !cur.includes(k) : cur.includes(x))); redraw(); }
    if (b.dataset.len) {
      // 반팔 티셔츠를 긴팔로 → 종류도 긴팔 티셔츠로, 반바지를 길게 → 슬랙스·면바지로
      const fx = LEN_FIXED[typeOf(it.type).id], nt = fx && LEN_SWAP[fx]?.[b.dataset.len];
      if (nt && nt !== it.type) { it.type = nt; it.warm = typeOf(nt).warm; $("#eType").value = nt; }
      it.len = b.dataset.len; rename(); redraw();
    }
    if (b.dataset.hem) { it.hem = b.dataset.hem; rename(); redraw(); }
    if (b.dataset.season) {
      const cur = curSeasons(), k = b.dataset.season;
      const next = cur.includes(k) ? cur.filter((x) => x !== k) : SEASONS.map((x) => x.id).filter((x) => x === k || cur.includes(x));
      if (!next.length) return toast("계절을 하나 이상 골라 주세요");
      it.seasons = next; seasonTouched = true; redraw();
    }
    const x = b.dataset.x;
    if (x === "close") closeSheet();
    if (x === "adjust") {
      if (!adj) { const c = await urlToCanvas(it.photo); adj = { cut: null, orig: c, W: c.width, H: c.height, init: { rot: 0, tilt: 0, z: 1, x: 0, y: 0 } }; adj.st = { ...adj.init, raw: true }; }
      openAdjust(adj, (photo) => { it.photo = photo; draw(); }, () => draw());
    }
    if (x === "newphoto") {
      // 새 사진 → 배경 지우기 → 사진 맞추기 → 다시 이 화면 (저장을 눌러야 바뀌어요)
      photoJob = { done: (photo, a) => { it.photo = photo; adj = a; delete it.basic; draw(); toast("사진을 바꿨어요. 저장을 눌러 주세요"); }, cancel: () => draw() };
      $("#fileIn").value = ""; $("#fileIn").click();
    }
    if (x === "del" && confirm(`'${it.name}'을(를) 지울까요?`)) { await itemStore.remove(it.id); closeSheet(); toast("지웠어요"); }
    if (x === "save") {
      if (!it.name.trim()) it.name = autoName(it);
      const data = { ...(it.basic ? { basic: it.basic } : {}), type: it.type, len: lenOf(it), warm: it.warm, color: it.color || "", pattern: it.pattern || "plain", sheer: hasSheer(it.type) ? it.sheer || "none" : "none", inner: hasInner(it.type) && !!it.inner,
        ...(hasHem(it.type) ? { hem: hemOf(it) } : {}), ...(typeOf(it.type).id === "shirt" ? { asOuter: it.asOuter !== false } : {}), ...(typeOf(it.type).cat === "top" && it.inner ? { innerPick: it.innerPick || [] } : {}), point: !!it.point, seasons: curSeasons(), ...(it.nope?.length ? { nope: it.nope } : {}), name: it.name.trim(), memo: it.memo || "", away: !!it.away,
        photo: it.photo || null, createdAt: it.createdAt || Date.now() };
      b.disabled = true;
      try { await itemStore.set(it.id, data); closeSheet(); toast(isNew ? "옷장에 넣었어요 👕" : "저장했어요"); }
      catch (err) { console.error(err); b.disabled = false; toast("저장하지 못했어요"); }
    }
  }
  draw();
}

// ---------- 기록 ----------
const slotText = (g) => SLOTS.filter((s) => FEEL[g.slots?.[s.id]]).map((s) => `${s.ko} ${FEEL[g.slots[s.id]].emoji}`).join(" ");
function renderLogs() {
  const done = logs.filter((g) => g.feel).sort((a, b) => b.id.localeCompare(a.id));
  const n = model.n;
  let txt;
  if (n < 3) txt = `<p>기록이 <b>${n}개</b> 있어요. 3개가 넘으면 나에게 맞춘 분석이 시작돼요.</p><p class="muted">홈에서 하루를 마칠 때 '오늘 입은 옷 어땠어요?'를 눌러 주세요.</p>`;
  else {
    const o10 = degOffset(10, model), o25 = degOffset(25, model);

    const cnt = (k) => done.filter((g) => g.feel === k).length;

      <p class="muted">${Object.entries(FEEL).map(([k, f]) => `${f.emoji} ${f.short} ${cnt(k)}`).join(" · ")}</p>`;
  }
  $("#analysisCard").innerHTML = `<h2>나의 체감</h2>${txt}${chartSvg(done)}`;
  // 느낌을 안 누른 지난 날도 입은 옷이 있으면 보여 줘요 (오늘 것은 홈에서)
  const shown = logs.filter((g) => g.feel || (g.items?.length && g.id < dateOf(0))).sort((a, b) => b.id.localeCompare(a.id));
  $("#logList").innerHTML = `<div class="row" style="margin-bottom:6px"><h2>날짜별 기록</h2><span class="spacer"></span><button class="btn" data-past>＋ 지난 날 기록</button></div>` + (shown.length ? shown.map((g) => {
    const list = (g.items || []).map((id) => byId[id]).filter(Boolean);
    return `<button class="log" data-log="${g.id}"><span class="em">${g.feel ? FEEL[g.feel].emoji : "📝"}</span><span><div class="dt">${md(g.id)}</div><div class="muted">체감 ${r1(g.T)}° · ${slotText(g) || (g.feel ? FEEL[g.feel].ko : "느낌을 아직 안 눌렀어요")}</div></span>
      <span class="mini">${list.slice(0, 4).map((it) => `<span class="ph">${phHtml(it)}</span>`).join("")}</span></button>`;
  }).join("") : `<p class="muted">아직 기록이 없어요. 지난 날 입었던 옷도 <b>＋ 지난 날 기록</b>으로 넣을 수 있어요.</p>`);
}
$("#logList").addEventListener("click", (e) => {

function openLog(id) {

      : `<div class="feels" style="margin-top:0">${Object.entries(FEEL).map(([k, f]) => `<button class="feel-btn${g.feel === k ? " on" : ""}" data-feel="${k}"><span>${f.emoji}</span>${f.ko}</button>`).join("")}</div>`}
    <button class="btn block" style="margin-top:14px" data-x="edit">✏️ 입은 옷·날씨 고치기</button>

// ---------- 지난 날 기록 ----------
// 날짜를 고르면 그날 날씨를 받아 오고, 입은 옷과 느낌(아침·낮·저녁)을 골라서 저장해요.
const pastWx = {};   // 한 번 받은 날씨는 다시 안 받아요
async function pastWeather(date) {
  const p = S.place.mode === "gps" ? (ls.get("wx.lastPos", null) || DEFAULT_PLACE) : S.place;
  const key = `${date}|${p.lat}|${p.lon}`;
  if (pastWx[key]) return pastWx[key];
  const q = `latitude=${p.lat}&longitude=${p.lon}&hourly=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=weather_code&start_date=${date}&end_date=${date}&timezone=auto&wind_speed_unit=ms`;
  // 최근 석 달쯤은 예보 서버에, 그보다 옛날은 기록 보관 서버에 있어요
  for (const host of ["https://api.open-meteo.com/v1/forecast", "https://archive-api.open-meteo.com/v1/archive"]) {
    try {
      const r = await fetch(`${host}?${q}`);
      if (!r.ok) continue;
      const data = await r.json();
      if (data.hourly?.apparent_temperature?.some((x) => x != null)) return (pastWx[key] = { data, place: p.name || "현재 위치" });
    } catch {}
  }
  return null;
}

function openPast(date = dateOf(-1)) {
  const st = { date };
  const reset = () => { const g = logOf(st.date); st.old = g; st.sel = new Set(g?.items || []); st.slots = { ...(g?.slots || {}) }; st.feel = g?.feel || null; st.manualT = g?.T ?? ""; };
  const load = async () => {
    st.info = undefined; draw();   // undefined = 불러오는 중
    const d = st.date, w = await pastWeather(d);
    if (st.date !== d || $("#pastDate") == null) return;   // 그사이 날짜를 바꿨거나 창을 닫았으면 무시
    st.info = w ? hoursInfo(w.data, d) : null; st.place = w?.place; draw();
  };
  const draw = () => {
    const y = $("#sheet").scrollTop, info = st.info, sl = info ? slotFeels(info.hours) : [];
    const list = [...st.sel].map((id) => byId[id]).filter(Boolean);
    const T = info ? info.T : parseFloat(st.manualT);
    const fw = list.length && isFinite(T) ? fitWord(outfitWarmth(list) - target(T, model)) : null;
    const wxHtml = info === undefined ? `<div class="skel">그날 날씨 불러오는 중…</div>`
      : info ? `<div class="wx-main"><div class="wx-icon">${WCODE(info.code)[0]}</div><div><div class="wx-feel">${r1(info.T)}°<small>그날 체감</small></div>
          <div class="muted">${WCODE(info.code)[1]} · 최저 ${r1(info.tmin)}° 최고 ${r1(info.tmax)}° · 📍${esc(st.place)}</div></div></div>${list.length ? slotHtml(list, info) : ""}`
      : `<p class="muted" style="margin:0 0 6px">그날 날씨를 못 불러왔어요(인터넷 확인). 그날 체감 온도를 직접 넣어 주세요.</p><input type="text" inputmode="decimal" id="pastT" value="${esc(st.manualT)}" placeholder="예: 12">`;
    const rate = sl.length ? `<div>${rateRows(sl, st.slots)}</div>`
      : `<div class="feels" style="margin-top:0">${Object.entries(FEEL).map(([k, f]) => `<button class="feel-btn${st.feel === k ? " on" : ""}" data-feel="${k}"><span>${f.emoji}</span>${f.ko}</button>`).join("")}</div>`;
    openSheet(`<div class="sheet-head"><h2>지난 날 기록</h2><button class="btn ghost" data-x="close">닫기</button></div>
      <label class="f" style="margin-top:0">날짜</label><input type="date" id="pastDate" value="${st.date}" max="${dateOf(-1)}" min="2000-01-01">
      ${st.old ? `<p class="muted" style="margin:6px 0 0">이 날 기록이 이미 있어요. 고쳐서 저장하면 바뀌어요.</p>` : ""}
      <div class="card" style="margin:12px 0 0">${wxHtml}</div>
      <div class="outfit-head" style="margin:16px 0 0"><h2>입은 옷</h2>${fw ? `<span class="fitword ${fw[1]}">${fw[0]}</span>` : ""}</div>
      ${items.length ? Object.entries(CATS).map(([c, cat]) => { const l = items.filter((it) => typeOf(it.type).cat === c); return l.length ? `<label class="f">${cat.ko}</label><div class="pick-grid">${l.map((it) => `<button class="pick${st.sel.has(it.id) ? " on" : ""}" data-id="${it.id}"><div class="ph">${phHtml(it)}</div><div class="nm">${esc(it.name)}</div></button>`).join("")}</div>` : ""; }).join("") : `<p class="muted">옷장에 옷이 없어요. 옷장에서 먼저 옷을 넣어 주세요.</p>`}
      <label class="f">어땠어요?</label>${rate}
      <div class="row" style="margin-top:16px"><button class="btn" data-x="close">취소</button><button class="btn primary spacer" data-x="save" ${info === undefined ? "disabled" : ""}>저장</button></div>`, onClick, true);
    $("#sheet").scrollTop = y;
    $("#pastDate").onchange = () => {
      const v = $("#pastDate").value;
      if (!v || v > dateOf(-1)) { $("#pastDate").value = st.date; return toast("어제까지의 날짜를 골라 주세요"); }
      st.date = v; reset(); load();
    };
    if ($("#pastT")) $("#pastT").oninput = () => { st.manualT = $("#pastT").value; };
  };
  async function onClick(e) {
    const p = e.target.closest("[data-id]");
    if (p) { st.sel.has(p.dataset.id) ? st.sel.delete(p.dataset.id) : st.sel.add(p.dataset.id); return draw(); }
    const r = e.target.closest("[data-slot]");
    if (r) { st.slots[r.dataset.slot] === r.dataset.feel ? delete st.slots[r.dataset.slot] : (st.slots[r.dataset.slot] = r.dataset.feel); return draw(); }
    const f = e.target.closest("[data-feel]");
    if (f) { st.feel = st.feel === f.dataset.feel ? null : f.dataset.feel; return draw(); }
    const x = e.target.closest("[data-x]")?.dataset.x;
    if (x === "close") closeSheet();
    if (x === "save") {
      const info = st.info, T = info ? info.T : parseFloat(String(st.manualT).replace(",", "."));
      if (!isFinite(T)) return toast("그날 체감 온도를 넣어 주세요");
      const sl = info ? slotFeels(info.hours) : [];
      const feel = sl.length ? overallFeel(st.slots) : st.feel;
      const list = [...st.sel].map((id) => byId[id]).filter(Boolean);
      if (!list.length && !feel) return toast("입은 옷이나 느낌을 골라 주세요");
      const want = target(T, model);
      const rec = { ...(st.old || {}), date: st.date, T: +T.toFixed(1), tmin: info ? info.tmin : T, tmax: info ? info.tmax : T, want: +want.toFixed(2),
        items: list.map((x) => x.id), W: +(list.length ? outfitWarmth(list) : want).toFixed(2), feel: feel || null, at: Date.now(), past: true,
        slots: sl.length ? st.slots : {}, slotT: sl.length ? Object.fromEntries(sl.map((s) => [s.id, +s.T.toFixed(1)])) : {} };
      try { await logStore.set(st.date, rec); closeSheet(); toast(`${md(st.date)} 기록을 저장했어요${feel ? "" : " (느낌을 누르면 추천에 반영돼요)"}`); }
      catch (err) { console.error(err); toast("저장하지 못했어요"); }
    }
  }
  reset(); load();
}

// 그래프: 가로 = 체감 온도, 세로 = 입은 옷 따뜻함
function chartSvg(done) {
  const W = 320, H = 200, L = 30, R = 10, T = 10, B = 26;
  const ts = done.flatMap((g) => feelPoints(g).map((p) => p[0]));
  const x0 = Math.min(-5, ...ts.map((t) => Math.floor(t / 5) * 5)), x1 = Math.max(30, ...ts.map((t) => Math.ceil(t / 5) * 5));
  const y1 = 22;
  const X = (t) => L + ((t - x0) / (x1 - x0)) * (W - L - R), Y = (w) => T + (1 - w / y1) * (H - T - B);
  const line = (f) => { let d = ""; for (let t = x0; t <= x1; t += 1) d += `${d ? "L" : "M"}${X(t).toFixed(1)},${Y(Math.min(y1, f(t))).toFixed(1)}`; return d; };
  let g = "";
  for (let t = Math.ceil(x0 / 10) * 10; t <= x1; t += 10) g += `<line x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${H - B}" stroke="var(--line)"/><text x="${X(t)}" y="${H - 8}" font-size="11" text-anchor="middle" fill="var(--sub)">${t}°</text>`;
  g += `<text x="4" y="${T + 10}" font-size="10" fill="var(--sub)">따뜻</text><text x="4" y="${H - B}" font-size="10" fill="var(--sub)">얇게</text>`;
  g += `<path d="${line(base)}" fill="none" stroke="var(--sub)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  if (model.n >= 3) g += `<path d="${line((t) => target(t, model))}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  const col = { cold: "var(--cold)", cool: "color-mix(in srgb, var(--cold) 50%, var(--card))", good: "var(--good)", warm: "color-mix(in srgb, var(--hot) 50%, var(--card))", hot: "var(--hot)" };
  for (const d of done) {
    const list = (d.items || []).map((id) => byId[id]).filter(Boolean);
    const w = list.length === (d.items || []).length && list.length ? outfitWarmth(list) : d.W;
    if (w == null) continue;
    const pts = feelPoints(d);
    for (const [t, f] of pts) g += `<circle cx="${X(t).toFixed(1)}" cy="${Y(Math.min(y1, w)).toFixed(1)}" r="${pts.length > 1 ? 4 : 5}" fill="${col[f]}" stroke="var(--card)" stroke-width="1.5"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="체감 온도별 입은 옷 따뜻함">${g}</svg>
    <div class="legend"><span><i class="line" style="background:var(--sub)"></i>보통 사람 기준</span>${model.n >= 3 ? `<span><i class="line" style="background:var(--accent)"></i>나에게 맞춘 기준</span>` : ""}
    ${Object.entries(FEEL).map(([k, f]) => `<span><i style="background:${col[k]}"></i>${f.short}</span>`).join("")}</div>
    <p class="muted" style="margin:8px 0 0">점 하나가 하루예요(아침·낮·저녁을 따로 누른 날은 시간대마다 하나). 파란 점(추웠던 날)이 많으면 선이 위로 올라가서 더 따뜻하게 추천해요.</p>`;
}

// ---------- 설정 ----------
function renderSet() {
  $("#setPlaceNow").textContent = S.place.mode === "gps" ? "지금: 현재 위치 자동" : `지금: ${S.place.name}`;
  const opt = (a, b, v) => Array.from({ length: b - a + 1 }, (_, i) => a + i).map((h) => `<option value="${h}" ${h === v ? "selected" : ""}>${h}시</option>`).join("");
  $("#setStart").innerHTML = opt(5, 14, S.start);
  $("#setEnd").innerHTML = opt(15, 23, S.end);
  const code = ls.get("wx.code");
  $("#setStore").innerHTML = online()
    ? `<h2>저장 (Firebase)</h2><p class="muted">옷장과 기록이 인터넷에 저장돼요. 다른 폰에서도 아래 코드를 넣으면 같은 옷장을 볼 수 있어요. 코드는 비밀번호처럼 나만 알고 있어야 해요.</p>
       <div class="code">${esc(code)}</div><div class="row" style="margin-top:8px"><button class="btn" data-s="copy">코드 복사</button><button class="btn ghost" data-s="change">다른 코드로 바꾸기</button></div>`
    : CFG.FIREBASE
      ? `<h2>저장</h2><p class="muted">아직 코드를 정하지 않았어요.</p><button class="btn primary" data-s="welcome">시작하기</button>`
      : `<h2>저장 (이 폰에만)</h2><p class="muted">지금은 이 폰에만 저장돼요. Firebase를 연결하면 폰을 바꿔도 옷장과 기록이 남아요.</p>`;
  $("#appVer").textContent = VERSION;
  renderNope();
  aiState();
}
// 설정: '마음에 안 들어요'로 뺀 코디 목록 + 취소
function renderNope() {
  const L = nopeList();
  $("#setNope").innerHTML = `<h2>👎 마음에 안 드는 코디 <span class="muted">${L.length ? L.length + "개" : ""}</span></h2>
    <p class="muted">오늘 화면에서 '마음에 안 들어요'를 누른 코디예요. 이 옷 조합은 추천하지 않아요. 취소하면 다시 추천할 수 있어요.</p>
    ${L.length ? L.map((n) => { const list = n.ids.map((id) => byId[id]).filter(Boolean);
      return `<div class="nope-row"><div class="nope-pics">${list.map((it) => `<div class="ph" title="${esc(it.name)}">${phHtml(it)}</div>`).join("")}</div>
        <div class="nope-txt"><b>${list.map((it) => esc(it.name)).join(" + ")}</b><span class="muted">${n.date ? md(n.date) : ""}</span></div>
        <button class="btn" data-nope="${n.owner.id}:${n.i}">취소</button></div>`; }).join("")
      : `<p class="muted" style="margin:8px 0 0">아직 없어요.</p>`}`;
}
$("#setNope").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-nope]");
  if (!b) return;
  const [oid, i] = b.dataset.nope.split(":"), it = items.find((x) => x.id === oid);
  if (!it) return;
  const { id, ...data } = it, nope = (data.nope || []).filter((_, k) => k !== +i);
  b.disabled = true;
  try { await itemStore.set(id, { ...data, nope }); toast("취소했어요. 이 코디도 다시 추천해요"); }
  catch (err) { console.error(err); b.disabled = false; toast("저장하지 못했어요"); }
});
$("#setStart").addEventListener("change", () => { S.start = +$("#setStart").value; saveS(); recKey = ""; renderHome(); });
$("#setEnd").addEventListener("change", () => { S.end = +$("#setEnd").value; saveS(); recKey = ""; renderHome(); });
$("#setGps").addEventListener("click", async () => { S.place = { ...DEFAULT_PLACE, mode: "gps" }; saveS(); renderSet(); await start(true); toast("현재 위치로 바꿨어요"); });
$("#setCity").addEventListener("click", openCity);
$("#btnPlace").addEventListener("click", openCity);
$("#setStore").addEventListener("click", async (e) => {
  const s = e.target.closest("[data-s]")?.dataset.s;
  if (s === "copy") { try { await navigator.clipboard.writeText(ls.get("wx.code")); toast("복사했어요"); } catch { toast("길게 눌러 복사해 주세요"); } }
  if (s === "change" || s === "welcome") openWelcome(s === "change");
});

function openCity() {
  openSheet(`<div class="sheet-head"><h2>지역 고르기</h2><button class="btn ghost" data-x="close">닫기</button></div>
    <input type="search" id="cityQ" placeholder="예: 해운대, 강남, 제주" enterkeyhint="search">
    <div class="results" id="cityRes"></div>
    <button class="btn block" style="margin-top:12px" data-x="gps">📍 현재 위치 자동으로</button>`, async (e) => {
    const x = e.target.closest("[data-x]")?.dataset.x;
    if (x === "close") closeSheet();
    if (x === "gps") { S.place = { ...DEFAULT_PLACE, mode: "gps" }; saveS(); closeSheet(); await start(true); }
    const r = e.target.closest("[data-lat]");
    if (r) { S.place = { mode: "fixed", name: r.dataset.name, lat: +r.dataset.lat, lon: +r.dataset.lon }; saveS(); closeSheet(); renderSet(); await start(true); toast(`${r.dataset.name} 날씨로 바꿨어요`); }
  });
  let timer;
  $("#cityQ").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(search, 350); });
  $("#cityQ").focus();
  async function search() {
    const q = $("#cityQ").value.trim();
    if (!q) { $("#cityRes").innerHTML = ""; return; }
    try {
      const r = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=ko&countryCode=KR`)).json();
      $("#cityRes").innerHTML = (r.results || []).map((p) => { const name = [p.admin1, p.admin2, p.name].filter((x, i, a) => x && a.indexOf(x) === i).slice(-2).join(" ");
        return `<button data-lat="${p.latitude}" data-lon="${p.longitude}" data-name="${esc(name)}"><b>${esc(p.name)}</b> <span class="muted">${esc([p.admin1, p.admin2].filter(Boolean).join(" "))}</span></button>`; }).join("") || `<p class="muted">찾는 지역이 없어요</p>`;
    } catch { $("#cityRes").innerHTML = `<p class="muted">검색이 안 돼요. 인터넷을 확인해 주세요</p>`; }
  }
}

// AI 파일 상태
async function aiState() {
  try {
    const c = await caches.open("transformers-cache"), keys = await c.keys();
    const has = (m) => keys.some((k) => k.url.includes(m) && k.url.endsWith(".onnx"));
    const A = await import("./ai.js");
    const ok = has(A.BG_MODEL) && has(A.CLIP_MODEL);
    $("#aiState").textContent = ok ? "✓ AI 파일이 폰에 있어요" : keys.length ? "일부만 받았어요" : "아직 안 받았어요";
  } catch { $("#aiState").textContent = ""; }
}
$("#aiPre").addEventListener("click", async () => {
  const b = $("#aiPre"); b.disabled = true;
  try {
    const A = await import("./ai.js");
    await A.loadBg((p, t) => (b.textContent = t));
    await A.loadClip((p, t) => (b.textContent = t));
    toast("AI 준비 끝!");
  } catch (e) { console.error(e); toast("받지 못했어요. 인터넷을 확인해 주세요"); }
  b.textContent = "AI 미리 받기"; b.disabled = false; aiState();
});
$("#aiDel").addEventListener("click", async () => { if (!confirm("AI 파일을 지울까요? 다음에 옷을 넣을 때 다시 받아요.")) return; await caches.delete("transformers-cache"); aiState(); toast("지웠어요"); });

// ---------- 처음 시작 (Firebase 코드) ----------
const newCode = () => { const A = "abcdefghjkmnpqrstuvwxyz23456789"; return Array.from(crypto.getRandomValues(new Uint8Array(16)), (x) => A[x % A.length]).join(""); };
function openWelcome(changing = false) {
  openSheet(`<div class="sheet-head"><h2>${changing ? "코드 바꾸기" : "반가워요! 👋"}</h2>${changing ? `<button class="btn ghost" data-x="close">닫기</button>` : ""}</div>
    <p>옷장과 기록은 <b>나만의 코드</b>로 저장돼요. 폰을 바꾸거나 다른 폰에서 쓸 때 이 코드만 있으면 돼요.</p>
    <button class="btn primary block" data-x="new">처음 써요 — 새로 시작</button>
    ${ls.get("wx.data.items", []).length || ls.get("wx.data.logs", []).length ? `<p class="muted" style="margin:6px 0 0">이 폰에 있던 옷 ${ls.get("wx.data.items", []).length}벌과 기록 ${ls.get("wx.data.logs", []).length}개는 새 코드로 그대로 옮겨져요.</p>` : ""}
    <label class="f">다른 폰에서 쓰던 코드가 있어요</label>
    <div class="row"><input type="text" id="codeIn" placeholder="코드 붙여 넣기" autocapitalize="off" autocomplete="off"><button class="btn" data-x="use">확인</button></div>`, async (e) => {
    const x = e.target.closest("[data-x]")?.dataset.x;
    if (x === "close") closeSheet();
    if (x === "new") { ls.set("wx.migrate", true); setCode(newCode()); }   // 새로 시작: 이 폰에 있던 옷장·기록을 옮겨요
    if (x === "use") { const c = $("#codeIn").value.trim().toLowerCase(); if (c.length < 12) return toast("코드가 너무 짧아요 (12자 이상)"); setCode(c); }
  }, !changing);
}
function setCode(c) { ls.set("wx.code", c); location.reload(); }

// ---------- 화면 이동 ----------
let view = "home";
function go(v) {
  view = v;
  for (const k of ["home", "closet", "log", "set"]) $(`#${k}View`).hidden = k !== v;
  $$("#tabbar button").forEach((b) => b.classList.toggle("on", b.dataset.go === v));
  if (v === "closet") renderCloset();
  if (v === "log") renderLogs();
  if (v === "set") renderSet();
  if (v === "home") renderHome();
  scrollTo(0, 0);
}
$("#tabbar").addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });

// ---------- 창 ----------
let sheetLocked = false;
function openSheet(html, onClick, locked = false) {
  sheetLocked = locked;
  $("#sheet").innerHTML = `<div class="grab"></div>` + html;
  $("#sheet").onclick = onClick || null;
  $("#sheetBg").hidden = false;
  $("#sheetBg").onclick = (e) => { if (e.target === $("#sheetBg") && !sheetLocked) closeSheet(); };
}
function closeSheet() { $("#sheetBg").hidden = true; $("#sheet").innerHTML = ""; }

// 이너 고르기용 옷(흰색 나시·히트텍 등) 그림: 옷장에 없으면 이 그림으로 보여요
VIRTUAL_INNERS.forEach((v) => { v.photo = basicUrl(INNER_PICKS.find((p) => p.id === v.pick).basic, COLORS[v.color]); });

// ---------- 시작 ----------
function refresh() {
  byId = Object.fromEntries([...VIRTUAL_INNERS, ...items].map((x) => [x.id, x]));   // 이너 고르기용 옷(흰색 나시 등)도 기록에서 보이게
  model = fit(logs, byId);
  if (view === "home") renderHome();
  if (view === "closet") renderCloset();
  if (view === "log") renderLogs();
  if (view === "set") renderNope();
}
async function start(force = false) {
  try { await loadWeather(force); } catch (e) { console.error(e); if (!wx) toast("날씨를 불러오지 못했어요"); }
  recKey = "";
  refresh();
}
// '새로 시작'을 누른 뒤 처음 한 번: 이 폰에만 있던 옷장·기록을 Firebase로 올려요 (폰에 있던 건 그대로 남겨 둬요)
async function migrateLocal() {
  const L = ls.get("wx.data.items", []), G = ls.get("wx.data.logs", []);
  try {
    for (const x of L) await itemStore.set(x.id, x);
    for (const g of G) await logStore.set(g.id, g);
    ls.set("wx.migrate", false);
    if (L.length || G.length) toast(`이 폰에 있던 옷 ${L.length}벌·기록 ${G.length}개를 옮겼어요`);
  } catch (e) { console.error(e); toast("옷장을 옮기지 못했어요. 인터넷을 확인하고 앱을 다시 열어 주세요"); }
}
// 예전 기본 옷(옛날 그림)을 새 그림으로 한 번 바꿔요. 이름·두께·계절 등은 그대로, 색은 지금 옷의 색으로 그려요.
let basicsFixing = false;
async function redrawOldBasics(list) {
  const old = list.filter((it) => OLD_BASIC[it.basic]);
  if (!old.length || basicsFixing) return;
  basicsFixing = true;
  let n = 0;
  for (const it of old) {
    try {
      const [kind, keyColor] = OLD_BASIC[it.basic].split(":");
      const color = COLORS[it.color] && it.color !== "여러색" ? it.color : keyColor;
      const c = await basicCanvas(kind, COLORS[color]);
      const { id, ...data } = it;
      await itemStore.set(id, { ...data, basic: `${kind}:${color}`, photo: toStored(c, 420) });
      n++;
    } catch (e) { console.error(e); }
  }
  basicsFixing = false;
  if (n) toast(`기본 옷 ${n}벌을 새 그림으로 바꿨어요`);
}
async function boot() {
  if (online()) {
    try { const code = ls.get("wx.code"); itemStore = await firebaseStore(code, "items"); logStore = await firebaseStore(code, "logs"); }
    catch (e) { console.error(e); toast("인터넷 저장소에 연결하지 못해서 이 폰에만 저장해요"); itemStore = localStore("items"); logStore = localStore("logs"); }
  } else { itemStore = localStore("items"); logStore = localStore("logs"); }
  if (online() && ls.get("wx.migrate")) await migrateLocal();
  itemStore.subscribe((list) => { items = list; refresh(); redrawOldBasics(list); });
  logStore.subscribe((list) => { logs = list; refresh(); });
  start();
  if (CFG.FIREBASE && !ls.get("wx.code")) openWelcome();
}
// 앱을 다시 열었을 때 날짜가 바뀌었거나 오래됐으면 새로
document.addEventListener("visibilitychange", () => { if (!document.hidden) start(); });
window.__appReady = true;   // 앱 코드가 다 읽혔어요 (위 안전장치가 안 떠요)
document.getElementById("rescue")?.remove();   // 늦게라도 켜졌으면 안전장치 화면은 치워요
boot();

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "127.0.0.1")) navigator.serviceWorker.register("sw.js");
</script>
